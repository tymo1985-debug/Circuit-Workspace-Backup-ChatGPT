name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Подключить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверить структуру, JSON, JavaScript и локальные ссылки
        run: node scripts/validate-repository.mjs

      - name: Проверить версии модулей
        run: node scripts/check-versions.mjs
